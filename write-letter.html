<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Write Love Letter</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="page-overlay"></div>

  <img src="./images/peonies.png" class="peony-border" alt="">

  <button class="menu-btn" id="menuBtn">☰</button>

  <nav class="side-menu" id="sideMenu">
    <button class="close-menu" id="closeMenu">×</button>

    <a href="index.html">Home</a>
    <a href="write-letter.html">Write Love Letter</a>
    <a href="letters.html">Saved Love Letters</a>
    <a href="daily.html">Daily Question</a>
  </nav>

  <main class="letters-page">

    <h1>Write A Love Letter ❤️</h1>

    <input
      id="letterFrom"
      class="from-input"
      type="text"
      placeholder="From:"
    >

    <textarea
      id="letterText"
      class="letter-box"
      placeholder="Write your love letter here..."
    ></textarea>

    <button id="saveLetterBtn" class="love-btn">
      Save Letter
    </button>

    <br><br>

    <a href="letters.html" class="love-btn">
      View Saved Letters
    </a>

  </main>

  <script src="script.js"></script>

</html>
