<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Read Love Letter</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <img src="./images/peonies.png" class="peony-border" alt="">

  <main class="letters-page">
    <div id="singleLetter"></div>

    <a href="letters.html" class="love-btn back-btn">
      Back to Saved Letters
    </a>
  </main>

  <script>
  const SUPABASE_URL = "https://dyhuylpyjsevmsxfjqyb.supabase.co";
  const SUPABASE_KEY = "sb_publishable_kILXOA3VZ2x-woWhnHZx2Q_iI-0oDKV";

  const singleLetter = document.getElementById("singleLetter");
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");

  async function loadSingleLetter() {
    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/love_letters?id=eq.${id}&select=*`,
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`
        }
      }
    );

    const letters = await response.json();
    const letter = letters[0];

    if (!letter) {
      singleLetter.innerHTML = "<p class='empty-text'>Letter not found.</p>";
      return;
    }

    singleLetter.innerHTML = `
      <div class="single-letter-card">
        <h1>From: ${letter.sender}</h1>
        <p>${letter.message}</p>
        <small>${new Date(letter.created_at).toLocaleString()}</small>
      </div>
    `;
  }

  loadSingleLetter();
</script>
</body>
</html>
