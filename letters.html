<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Love Letters - Saved</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <button class="menu-btn" id="menuBtn">☰</button>

<nav class="side-menu" id="sideMenu">
  <button class="close-menu" id="closeMenu">×</button>
  <a href="index.html">Home</a>
  <a href="letters.html">Love Letters</a>
  <a href="daily.html">Daily Question</a>
</nav>

  <img src="./images/peonies.png" class="peony-border" alt="">

  <main class="letters-page">
    <h1>Love Letters - Saved</h1>


    <h2>Write A Love Letter ❤️</h2>

<input
  id="letterFrom"
  class="from-input"
  type="text"
  placeholder="From:"
>

<textarea
  id="letterText"
  class="letter-box"
  placeholder="Write your love letter here..."
></textarea>

<button id="saveLetterBtn" class="love-btn">
  Save Letter
</button>

<br><br>

<h2>Saved Love Letters ❤️</h2>

    <div id="lettersList"></div>

    <a href="index.html" class="love-btn back-btn">Back</a>
  </main>

  <script>
  const SUPABASE_URL = "https://dyhuylpyjsevmsxfjqyb.supabase.co";
  const SUPABASE_KEY = "sb_publishable_kILXOA3VZ2x-woWhnHZx2Q_iI-0oDKV";

  const lettersList = document.getElementById("lettersList");

  async function loadLetters() {
    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/love_letters?select=*&order=created_at.desc`,
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`
        }
      }
    );

    const letters = await response.json();

    if (letters.length === 0) {
      lettersList.innerHTML = "<p class='empty-text'>No love letters saved yet.</p>";
      return;
    }

    letters.forEach(letter => {
      const card = document.createElement("div");
      card.className = "letter-card";

      card.innerHTML = `
        <h3>From: ${letter.sender}</h3>
        <p>${letter.message.substring(0, 120)}...</p>
        <small>${new Date(letter.created_at).toLocaleString()}</small>

        <a href="read.html?id=${letter.id}" class="love-btn">
          Read Letter
        </a>

        <button class="delete-btn" data-id="${letter.id}">
          Delete Letter
        </button>
      `;

      lettersList.appendChild(card);
    });

    document.querySelectorAll(".delete-btn").forEach(btn => {
      btn.addEventListener("click", async () => {
        if (!confirm("Delete this love letter?")) return;

        await fetch(`${SUPABASE_URL}/rest/v1/love_letters?id=eq.${btn.dataset.id}`, {
          method: "DELETE",
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`
          }
        });

        location.reload();
      });
    });
  }

  loadLetters();
</script>
</body>
</html>
