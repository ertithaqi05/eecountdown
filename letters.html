<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Love Letters - Saved</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <img src="./images/peonies.png" class="peony-border" alt="">

  <main class="letters-page">
    <h1>Love Letters - Saved</h1>

    <div id="lettersList"></div>

    <a href="index.html" class="love-btn back-btn">Back</a>
  </main>

  <script>
    const lettersList = document.getElementById("lettersList");
    const letters = JSON.parse(localStorage.getItem("loveLetters")) || [];

    if (letters.length === 0) {
      lettersList.innerHTML = "<p class='empty-text'>No love letters saved yet.</p>";
    } else {
      letters.reverse().forEach((letter, index) => {
        const card = document.createElement("div");
        card.className = "letter-card";

        card.innerHTML = `
        <h3>From: ${letter.from}</h3>
        <p>${letter.text.substring(0, 120)}...</p>
        <small>${letter.date}</small>

        <a href="read.html?index=${letters.length - 1 - index}" class="love-btn">
        Read Letter
        </a>

        <button class="delete-btn" data-index="${index}">
        Delete Letter
        </button>
        `;

        lettersList.appendChild(card);
      });

    document.querySelectorAll(".delete-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    const deleteIndex = btn.dataset.index;

    const letters = JSON.parse(localStorage.getItem("loveLetters")) || [];

    if (confirm("Delete this love letter?")) {
    letters.splice(letters.length - 1 - deleteIndex, 1);

    localStorage.setItem("loveLetters", JSON.stringify(letters));

    location.reload();
}
    localStorage.setItem("loveLetters", JSON.stringify(letters));

    location.reload();
    });
}); 
    }
  </script>
</body>
</html>
