<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E ❤️ E Countdown</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-overlay"></div>
  
  <img src="images/peonies.png" class="peony-border" alt="">

  <div class="mobile-peonies left">
  <img src="./images/peonies.png" alt="">
  </div>

  <div class="mobile-peonies right">
  <img src="./images/peonies.png" alt="">
  </div>

  <main class="container">
    <section class="hero">
      <div class="initials">
        <span>E</span>
        <div class="heart">♥</div>
        <span>E</span>
      </div>

      <p class="small-title">Countdown Until</p>
      <h1>31st January 2027, 00:00</h1>

      <div class="divider">
        <span></span>
        <p>♥</p>
        <span></span>
      </div>

      <section class="countdown" aria-label="Countdown timer">
        <div class="time-card">
          <p id="days">000</p>
          <span>Days</span>
        </div>
        <div class="time-card">
          <p id="hours">00</p>
          <span>Hours</span>
        </div>
        <div class="time-card">
          <p id="minutes">00</p>
          <span>Minutes</span>
        </div>
        <div class="time-card">
          <p id="seconds">00</p>
          <span>Seconds</span>
        </div>
      </section>

      <p class="message">Every second brings us closer. ♥</p>
    </section>
  </main>

  <section class="love-section">
  <h2>Love Letters</h2>

  <input id="letterFrom" class="from-input" type="text" placeholder="From:" />

  <textarea id="letterText" class="letter-box" placeholder="Write your love letter here..."></textarea>

  <button id="saveLetterBtn" class="love-btn">Save Letter</button>

  <a href="letters.html" class="view-link">View Saved Love Letters</a>
</section>

<section class="date-section">
  <h2>Pick Our Next Date</h2>

  <p id="dateIdea" class="date-idea">
    No date picked yet ❤️
  </p>

  <select id="dateSelect" class="date-select">
    <option value="">Choose a date idea...</option>
    <option value="Movie 🍿">Movie 🍿</option>
    <option value="Picnic in the park 🧺">Picnic in the park 🧺</option>
    <option value="Late night walk 🌙">Late night walk 🌙</option>
    <option value="Coffee date ☕">Coffee date ☕</option>
    <option value="Ice cream date 🍦">Ice cream date 🍦</option>
    <option value="Pasta???? (i already know its this one) 🍝">Pasta???? (i already know its this one) 🍝</option>
    <option value="Mini golf date ⛳">Mini golf date ⛳</option>
    <option value="Arcade date 🧸">Arcade date 🧸</option>
    <option value="Sunset walk 🌅">Sunset walk 🌅</option>
    <option value="Build a Lego set together 🧱">Build a Lego set together 🧱</option>
    <option value="Board game night 🎲">Board game night 🎲</option>
    <option value="Cake date 🍰">Cake date 🍰</option>
  </select>

  <button id="pickDateBtn" class="love-btn">
    Save Date
  </button>
</section>

<section class="reasons-section">
  <h2>Reasons I Love You</h2>

  <div id="loveReason" class="reason-card">
    Tap the button ❤️
  </div>

  <button id="reasonBtn" class="love-btn">
    Show Me A Reason
  </button>

</section>

  <script src="script.js"></script>

  <section class="song-section">
  <h2>Our Song</h2>

  <div class="song-card">
    <p class="song-message">Soon? ❤️</p>

    <iframe
      style="border-radius:18px"
      src="https://open.spotify.com/embed/track/273QnyCvJB65rScHJ1nPZb?utm_source=generator&theme=0"
      width="100%"
      height="152"
      frameborder="0"
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
      loading="lazy">
    </iframe>
  </div>
</section>

<section class="daily-section">
  <h2>Daily Question</h2>

  <div class="daily-card">
    <p id="dailyQuestion" class="daily-question"></p>

    <input
      id="dailyName"
      class="from-input"
      type="text"
      placeholder="From:"
    />

    <textarea
      id="dailyAnswer"
      class="letter-box daily-answer-box"
      placeholder="Write your answer..."
    ></textarea>

    <button id="submitDailyBtn" class="love-btn">
      Submit Answer
    </button>

    <div id="dailyResults" class="daily-results hidden"></div>
  </div>

  

</section>

<script src="script.js"></script>

</body>
</html>
