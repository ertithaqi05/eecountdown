<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E ❤️ E Countdown</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <img src="images/peonies.png" class="peony-border" alt="">

  <main class="container">
    <section class="hero">
      <div class="initials">
        <span>E</span>
        <div class="heart">♥</div>
        <span>E</span>
      </div>

      <p class="small-title">Countdown Until</p>
      <h1>31st January 2027, 00:00</h1>

      <div class="divider">
        <span></span>
        <p>♥</p>
        <span></span>
      </div>

      <section class="countdown" aria-label="Countdown timer">
        <div class="time-card">
          <p id="days">000</p>
          <span>Days</span>
        </div>
        <div class="time-card">
          <p id="hours">00</p>
          <span>Hours</span>
        </div>
        <div class="time-card">
          <p id="minutes">00</p>
          <span>Minutes</span>
        </div>
        <div class="time-card">
          <p id="seconds">00</p>
          <span>Seconds</span>
        </div>
      </section>

      <p class="message">Every second brings us closer. ♥</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
